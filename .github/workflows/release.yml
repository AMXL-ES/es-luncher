name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（例如 0.1.0）"
        required: true
        default: "0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED || 'false' }}

jobs:
  build-sign-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          $v = $v.TrimStart("v")
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "version=$v"

      - name: Build
        run: dotnet build EsLuncher.slnx -c Release --nologo

      - name: Test
        run: dotnet test EsLuncher.slnx -c Release --nologo

      - name: Publish portable zip
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/publish-portable.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Upload unsigned artifact (for SignPath)
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ESLuncher-${{ steps.ver.outputs.version }}
          path: artifacts/EsLuncher-${{ steps.ver.outputs.version }}-win-x64.zip
          if-no-files-found: error

      # 需要先在仓库 Variables 里设置 SIGNPATH_ENABLED=true 和下面几个变量
      - name: Sign with SignPath
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Unpack signed artifact
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $zip = Get-ChildItem signed -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw "SignPath 没有返回 zip" }
          $dir = "artifacts/EsLuncher-${{ steps.ver.outputs.version }}-win-x64"
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          Expand-Archive $zip.FullName -DestinationPath $dir -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} installer\es-luncher.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败" }

      - name: Refresh checksums
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $zip = "artifacts/EsLuncher-$v-win-x64.zip"
          $setup = "artifacts/ESLuncher-$v-setup.exe"
          $lines = @()
          if (Test-Path $zip) { $lines += "$((Get-FileHash $zip -Algorithm SHA256).Hash)  $(Split-Path $zip -Leaf)" }
          if (Test-Path $setup) { $lines += "$((Get-FileHash $setup -Algorithm SHA256).Hash)  $(Split-Path $setup -Leaf)" }
          $lines | Set-Content "artifacts/SHA256SUMS-$v.txt" -Encoding ascii
          Get-Content "artifacts/SHA256SUMS-$v.txt"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: ES Luncher ${{ steps.ver.outputs.version }}
          draft: true
          files: |
            artifacts/EsLuncher-${{ steps.ver.outputs.version }}-win-x64.zip
            artifacts/ESLuncher-${{ steps.ver.outputs.version }}-setup.exe
            artifacts/SHA256SUMS-${{ steps.ver.outputs.version }}.txt
          body: |
            ES Luncher ${{ steps.ver.outputs.version }}

            - Windows 10/11 x64
            - 安装包或便携 zip 任选
            - 未签名版本可能触发 SmartScreen，请先校验 SHA256SUMS
