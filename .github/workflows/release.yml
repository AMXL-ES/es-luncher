name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v，例如 0.1.5）"
        required: true
        default: "0.1.5"
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  build-test-pack:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          $v = $v.TrimStart("v")
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "version=$v"

      - name: Build (warnings are errors)
        run: dotnet build EsLuncher.slnx -c Release --nologo

      - name: Test
        run: dotnet test EsLuncher.slnx -c Release --nologo

      - name: Install vpk
        shell: pwsh
        run: |
          dotnet tool install vpk --tool-path "$env:RUNNER_TEMP\vpk"
          if ($LASTEXITCODE -ne 0) { throw "vpk 安装失败" }

      - name: Pack with Velopack (Setup + Portable + nupkg + delta)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/pack-velopack.ps1 `
            -Version "${{ steps.ver.outputs.version }}" `
            -VpkPath "$env:RUNNER_TEMP\vpk\vpk.exe"

      - name: Stage release files + checksums
        id: stage
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $src = "artifacts/releases"
          $out = "out"
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          New-Item -ItemType Directory -Force $out | Out-Null

          # 更新源索引与两类安装包必须齐全；delta 只在有上一个版本时生成。
          $required = @(
            "ESLuncher-win-Setup.exe",
            "ESLuncher-win-Portable.zip",
            "ESLuncher-$v-full.nupkg",
            "releases.win.json",
            "assets.win.json",
            "RELEASES"
          )
          foreach ($f in $required) {
            $p = Join-Path $src $f
            if (-not (Test-Path $p)) { throw "缺少发布文件：$f" }
            Copy-Item $p $out -Force
          }

          $delta = Join-Path $src "ESLuncher-$v-delta.nupkg"
          if (Test-Path $delta) {
            Copy-Item $delta $out -Force
            Write-Host "包含增量包 $([math]::Round((Get-Item $delta).Length/1KB,1)) KB"
          } else {
            Write-Warning "没有增量包（首个版本或未保留历史 release），本次只发完整包"
          }

          $lines = @()
          foreach ($f in (Get-ChildItem $out -File | Sort-Object Name)) {
            $lines += "$((Get-FileHash $f.FullName -Algorithm SHA256).Hash)  $($f.Name)"
          }
          $lines | Set-Content (Join-Path $out "SHA256SUMS-$v.txt") -Encoding ascii
          Get-ChildItem $out | ForEach-Object { "{0,-40} {1,10:N1} KB" -f $_.Name, ($_.Length/1KB) }

      # 代码签名接好后：给 pack-velopack.ps1 传 -PfxPath / -SignParams / -AzureTrustedSignFile
      # （见 docs/CODE-SIGNING.md 与 docs/SIGNPATH-SETUP.md），这一步现在只做未签名包。

      - name: Upload artifacts (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: es-luncher-${{ steps.ver.outputs.version }}
          path: out/*
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: ES Luncher ${{ steps.ver.outputs.version }}
          # tag 推送直接发布；手动触发先存草稿，由人确认后点 Publish
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          files: out/*
          body: |
            ES Luncher ${{ steps.ver.outputs.version }}

            **安装**：`ESLuncher-win-Setup.exe`（安装版）或 `ESLuncher-win-Portable.zip`（便携版）
            **要求**：Windows 10/11 x64 + .NET 10 桌面运行时（安装版自带）

            **未代码签名**：首次运行可能提示「未知发布者」，请先核对 `SHA256SUMS-${{ steps.ver.outputs.version }}.txt`。

            自动更新：程序内「其他 → 检查更新」；更新源指向本仓库 Releases。
